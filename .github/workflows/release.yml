---
# Automates an upstream release: GitHub release + binary assets + crates.io.
#
# The maintainer merges the "X.Y.Z release" commit and pushes the X.Y.Z tag,
# everything below happens on its own. See the Releasing section in
# CONTRIBUTING.md.
name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. 0.2.3"
        required: true
        type: string

permissions:
  contents: read

env:
  PROJECT_NAME: pretty-git-prompt

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check that the tag matches version in Cargo.toml
        id: version
        run: |
          set -eu
          version="${{ inputs.tag || github.ref_name }}"
          cargo_version=$(sed -n '/^\[package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag $version does not match version $cargo_version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # the release is created as a draft so that the assets are in place
      # before it is published: publishing is the event packit reacts to
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists, reusing it"
            exit 0
          fi
          gh release create "$VERSION" --draft --title "$VERSION" --generate-notes

  build:
    name: Build ${{ matrix.target }}
    needs: draft
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build the binary
        env:
          LIBZ_SYS_STATIC: 1
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          rustup target add "$TARGET"
          cargo build --target "$TARGET" --release

      - name: Name the asset the same way older releases did
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          set -eu
          cp -av "target/$TARGET/release/$PROJECT_NAME" \
            "$PROJECT_NAME-$VERSION-$TARGET"

      - name: Attach the asset to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          gh release upload "$VERSION" \
            "$PROJECT_NAME-$VERSION-$TARGET" --clobber

  publish-release:
    name: Publish the release
    needs: [draft, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # this is what triggers packit's propose_downstream job
      - name: Undraft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: gh release edit "$VERSION" --draft=false --latest

  crates-io:
    name: Publish to crates.io
    needs: [draft, build]
    runs-on: ubuntu-24.04
    permissions:
      # for the OIDC token crates.io trusted publishing exchanges for a
      # short-lived registry token, no secret is involved
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Is this version on crates.io already?
        id: check
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          set -eu
          if curl -sSf -H "user-agent: $PROJECT_NAME release workflow" \
              "https://crates.io/api/v1/crates/$PROJECT_NAME/$VERSION" \
              >/dev/null 2>&1; then
            echo "::notice::$PROJECT_NAME $VERSION is already on crates.io"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get a crates.io token via trusted publishing
        if: steps.check.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      - name: cargo publish
        if: steps.check.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
